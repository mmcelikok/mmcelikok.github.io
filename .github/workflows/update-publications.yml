name: Update Google Scholar Publications

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up a PAT if you want this
      # commit to trigger the deploy workflow automatically.
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publication sync script
        shell: bash
        run: |
          set +e
          timeout 150 python bin/update_scholar_publications.py
          status=$?
          if [ $status -eq 0 ]; then
            echo "✅ Publication sync succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publication sync script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            echo "📤 New publication(s) found — committing." &&
            git commit -m "Add new publication(s) found on Google Scholar" &&
            git push
          )
