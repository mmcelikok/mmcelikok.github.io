    # Not named "Awards": that al_folio_cv section template reads entry.title, which
    # RenderCV's Python side treats as a PublicationEntry marker requiring `authors`.
    # Plain bullets side-step the conflict and render identically both places.
    Awards and Grants:
      - bullet: "**2019** — ELLIS PhD Student. Nominated and accepted to the pan-European PhD programme of the European Lab for Learning and Intelligent Systems, as part of its first cohort."
      - bullet: "**2019** — KAUTE Personal Research Grant. Personal doctoral grant from the Finnish Science Foundation for Technology and Economics, received four times in a row (2019-2023), totalling 96,000 euros."
      - bullet: "**2020** — Aalto University Competitive Co-department Funding Recipient. PhD project granted co-department funding as part of an internal process."

    Service:
      - bullet: "Program Committee Member: NeurIPS, ICML, ICLR, AAAI, AAMAS, STOC, BNAIC, JMLR, JAIR"

