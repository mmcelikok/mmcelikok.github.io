        end_date: 2025
        summary: Co-organized both editions of this workshop at the AAAI Conference on Artificial Intelligence; the 2024 edition reached 300 registrations.

      - company: "ICLR Workshop: Multi-Agent Learning and Its Opportunities in the Era of Generative AI"
