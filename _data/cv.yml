  sections:
    Summary:
      - Assistant Professor at the University of Southern Denmark, working on multi-agent reinforcement learning, cooperative AI, and Bayesian/model-based approaches to human-AI interaction. PhD from Aalto University (2023), postdoc at TU Delft (2023-2025).

    Education:
      - institution: Aalto University
        location: Finland
        area: Computer Science
        degree: PhD
        start_date: 2019
        end_date: 2023
        highlights:
          - "Thesis: Model-based Multi-agent Reinforcement Learning for AI Assistants"
          - "Advisor: Professor Samuel Kaski"
          - "Opponent: Professor Matthew A. Taylor (University of Alberta)"
          - Nominated for the Dean's Award

      - institution: Aalto University
        location: Finland
        area: Machine Learning, Data Science and Artificial Intelligence (MACADAMIA)
        degree: MSc
        start_date: 2016
        end_date: 2018
        highlights:
          - Completed with honours (highest distinction)

      - institution: Selçuk University
        location: Turkey
        area: Computer Engineering
        degree: BEng
        start_date: 2011
        end_date: 2015
        highlights:
          - First-class honours (highest distinction)

    # NOTE: section title must be exactly "Experience" — the al_folio_cv gem only
    # renders Education/Experience/Awards/Publications/etc. by exact name match;
    # anything else silently renders empty. This merges appointments + teaching +
    # service + invited talks into one chronological list for that reason.
    Experience:
      - company: University of Southern Denmark, Department of Mathematics and Computer Science, Data Science Section
        position: Tenure-track Assistant Professor
        location: Denmark
        start_date: 2025
        end_date: present

      - company: Delft University of Technology
        position: Postdoctoral Researcher
        location: The Netherlands
        start_date: 2023
        end_date: 2025
        summary: >-
          Project on investigating advanced multi-agent reinforcement learning techniques for
          collaborative AI systems, funded for 3 years as part of the Dutch Hybrid Intelligence Centre.

      - company: Dutch National Research Institute for Mathematics and Computer Science (CWI)
        position: PhD Research Intern
        location: The Netherlands
        start_date: 2023-01
        end_date: 2023-04
        summary: >-
          Highly selective doctoral internship programme with stipend. Worked with Professor Wouter
          Koolen on the sample-complexity of Monte Carlo Tree Search.

      - company: Danish Pioneer Centre for AI Programme on Learning and Optimal Control in Dynamical Systems
        position: Co-director
        start_date: 2026
        end_date: 2028

      - company: Hybrid Intelligence Centre Reinforcement Learning SIG
        position: Co-leader
